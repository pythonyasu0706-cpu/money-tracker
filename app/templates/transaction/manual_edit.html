<!-- /template/transaction/manual_edit.html -->
{% extends "base.html" %}
{% block main_class %}max-w-[1200px] mx-auto pt-24 px-margin-mobile md:px-margin-desktop{% endblock %}
{% block content %}
    <section>
        <section class="text-center space-y-stack-sm pb-4">
            <h2 class="font-h1 text-h1 text-primary">会計情報を修正</h2>
        </section>
        <!-- 会計入力エリア -->
        <div id="formArea" class="bg-surface-container-lowest flex-1 flex flex-col">
            <!-- Main Input Fields -->
            <div class="h-full bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(26,54,93,0.05)] flex flex-col gap-stack-md">
                <!-- 収入支出切替 -->
                <div id="typeTab" class="flex gap-2 mb-0">
                    <button id="tabExpense" class="tab active px-3 py-1 border border-gray-300 rounded-full"">支出</button>
                    <button id="tabIncome" class="tab px-3 py-1 border border-gray-300 rounded-full"">収入</button>
                </div>
                <!-- Store Name -->
                <div class="flex flex-col gap-unit relative">
                    <div class="flex justify-between items-center">
                        <label class="font-label-caps text-label-caps text-on-surface-variant opacity-80">店名</label>
                    </div>
                    <div class="relative group">
                        <input id="storeName" class="w-full
                                    bg-white
                                    border
                                    border-outline-variant
                                    rounded-lg p-3
                                    font-data-entry
                                    text-data-entry
                                    focus:border-secondary
                                    focus:ring-1
                                    focus:ring-secondary
                                    transition-all
                                    outline-none"
                                    type="text" />
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 opacity-40 group-hover:opacity-100 transition-opacity">
                            <span class="material-symbols-outlined text-on-surface-variant" data-icon="edit">edit</span>
                        </div>
                    </div>
                </div>
                <!-- Date -->
                <div class="flex flex-col gap-unit">
                    <div class="flex justify-between items-center">
                        <label class="font-label-caps text-label-caps text-on-surface-variant opacity-80">日付</label>
                    </div>
                    <div class="relative group">
                        <input id="date" class="w-full
                                    bg-white
                                    border
                                    border-outline-variant
                                    rounded-lg p-3
                                    font-data-entry
                                    text-data-entry
                                    focus:border-secondary
                                    focus:ring-1
                                    focus:ring-secondary
                                    transition-all
                                    outline-none"
                                    type="date"/>
                    </div>
                </div>
                <!-- Amount -->
                <div class="flex flex-col gap-unit">
                    <div class="flex justify-between items-center">
                        <label class="font-label-caps text-label-caps text-on-surface-variant opacity-80">金額</label>
                    </div>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 font-h2 text-h2 text-on-surface-variant">¥</span>
                        <input id="amount" class="w-full
                                    bg-white border
                                    border-outline-variant
                                    rounded-lg p-3
                                    pl-10 font-h2 text-h2
                                    text-secondary
                                    focus:border-secondary
                                    focus:ring-1
                                    focus:ring-secondary
                                    transition-all outline-none"
                                    type="text" />
                    </div>
                </div>
                <!-- Account Category (Suggestions) -->
                <div class="flex flex-col gap-unit">
                    <div class="flex justify-between items-center">
                        <label class="font-label-caps text-label-caps text-on-surface-variant opacity-80">
                            勘定科目
                        </label>
                    </div>
                </div>
                <div id="categoryArea" class="flex flex-wrap gap-2">
                    <!-- ★ここにJSでボタン生成 -->
                </div>
                <!-- ▼隠しUI -->
                <select id="categorySelect" class="mt-2 border p-2 rounded w-full">
                    <option value="">選択してください</option>
                </select>
                <!-- 手入力 -->
                <div class="flex flex-col gap-unit">
                    <label class="font-label-caps text-label-caps text-on-surface-variant opacity-80">手入力</label>
                    <input id="customCategory"
                        type="text"
                        class="mt-2 border p-2 rounded w-full"
                        placeholder="勘定科目を入力">
                </div>
            </div>
        </div>
        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-stack-md mt-4 mb-28">
            <button type="button" id="saveBtn" class="flex-1 bg-white border border-secondary text-secondary py-4 rounded-lg font-h3 text-h3 hover:bg-surface-container transition-all active:bg-secondary flex items-center justify-center gap-2">
            <span class="material-symbols-outlined" data-icon="save" style="font-variation-settings: 'FILL' 1;">save</span>
                        保存する
                    </button>
            <button id="deleteBtn" class="flex-1 bg-white border border-secondary text-secondary py-4 rounded-lg font-h3 text-h3 hover:bg-surface-container transition-all active:bg-secondary flex items-center justify-center gap-2">
            <span class="material-symbols-outlined" data-icon="delete">delete</span>
                        削除
                    </button>
        </div>
    </section>
{% endblock %}
{% block scripts %}
<script>
    window.INIT_DATA = {{ data | tojson }};
</script>
<script src="/static/js/manual_edit.js"></script>
{% endblock %}
