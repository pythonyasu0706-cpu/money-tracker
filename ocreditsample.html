<!DOCTYPE html>

<html class="light" lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                  "on-error": "#ffffff",
                  "secondary-container": "#66affe",
                  "on-tertiary": "#ffffff",
                  "background": "#f7fafc",
                  "on-tertiary-fixed-variant": "#00522f",
                  "tertiary": "#002713",
                  "tertiary-container": "#003f23",
                  "inverse-surface": "#2d3133",
                  "inverse-on-surface": "#eef1f3",
                  "on-primary": "#ffffff",
                  "on-tertiary-fixed": "#002110",
                  "on-surface-variant": "#43474e",
                  "outline-variant": "#c4c6cf",
                  "surface-variant": "#e0e3e5",
                  "error": "#ba1a1a",
                  "surface-container-high": "#e5e9eb",
                  "on-primary-fixed-variant": "#2d476f",
                  "tertiary-fixed-dim": "#74db9d",
                  "surface-container-low": "#f1f4f6",
                  "surface-container-lowest": "#ffffff",
                  "on-background": "#181c1e",
                  "surface-tint": "#455f88",
                  "error-container": "#ffdad6",
                  "surface": "#f7fafc",
                  "on-secondary-fixed-variant": "#00497e",
                  "on-primary-container": "#86a0cd",
                  "on-surface": "#181c1e",
                  "outline": "#74777f",
                  "on-primary-fixed": "#001b3c",
                  "secondary": "#0061a5",
                  "secondary-fixed": "#d2e4ff",
                  "surface-container": "#ebeef0",
                  "surface-bright": "#f7fafc",
                  "on-error-container": "#93000a",
                  "primary-fixed-dim": "#adc7f7",
                  "primary": "#002045",
                  "primary-container": "#1a365d",
                  "primary-fixed": "#d6e3ff",
                  "on-secondary-fixed": "#001d37",
                  "on-secondary-container": "#004172",
                  "surface-container-highest": "#e0e3e5",
                  "secondary-fixed-dim": "#9fcaff",
                  "tertiary-fixed": "#91f8b8",
                  "surface-dim": "#d7dadc",
                  "on-secondary": "#ffffff",
                  "on-tertiary-container": "#4bb278",
                  "inverse-primary": "#adc7f7"
          },
          "borderRadius": {
                  "DEFAULT": "0.25rem",
                  "lg": "0.5rem",
                  "xl": "0.75rem",
                  "full": "9999px"
          },
          "spacing": {
                  "margin-mobile": "16px",
                  "unit": "8px",
                  "container-max": "1200px",
                  "gutter": "24px",
                  "stack-sm": "8px",
                  "stack-lg": "32px",
                  "stack-md": "16px",
                  "margin-desktop": "40px"
          },
          "fontFamily": {
                  "h3": ["Noto Sans JP"],
                  "body-md": ["Noto Sans JP"],
                  "h2": ["Noto Sans JP"],
                  "body-sm": ["Noto Sans JP"],
                  "label-caps": ["Inter"],
                  "data-entry": ["Inter"],
                  "body-lg": ["Noto Sans JP"],
                  "h1": ["Noto Sans JP"]
          },
          "fontSize": {
                  "h3": ["20px", {"lineHeight": "1.5", "fontWeight": "600"}],
                  "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                  "h2": ["24px", {"lineHeight": "1.4", "fontWeight": "700"}],
                  "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                  "label-caps": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                  "data-entry": ["16px", {"lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "500"}],
                  "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                  "h1": ["30px", {"lineHeight": "1.4", "letterSpacing": "-0.02em", "fontWeight": "700"}]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface min-h-screen pb-24">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 w-full z-50 fixed top-0 bg-surface dark:bg-on-background border-b border-surface-variant dark:border-outline-variant">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center p-2 rounded-full hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-secondary dark:text-secondary-fixed-dim" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 text-secondary dark:text-secondary-fixed-dim">解析内容の確認</h1>
</div>
<div class="font-h2 text-h2 text-primary dark:text-primary-fixed">OCR Expense</div>
</header>
<main class="mt-20 px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto">
<div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter">
<!-- Receipt Preview Panel (Left/Top) -->
<section class="lg:col-span-5 xl:col-span-4">
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(26,54,93,0.05)] sticky top-24 overflow-hidden">
<div class="p-4 border-b border-surface-variant flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant">RECEIPT PREVIEW</span>
<div class="flex gap-2">
<button class="p-1 hover:bg-surface-container rounded transition-colors"><span class="material-symbols-outlined text-on-surface-variant" data-icon="zoom_in">zoom_in</span></button>
<button class="p-1 hover:bg-surface-container rounded transition-colors"><span class="material-symbols-outlined text-on-surface-variant" data-icon="zoom_out">zoom_out</span></button>
</div>
</div>
<div class="aspect-[3/4] relative bg-surface-container-low flex items-center justify-center group">
<img alt="Receipt image" class="w-full h-full object-cover p-4 opacity-90" data-alt="A clear, high-resolution photograph of a standard paper receipt held against a dark, minimalist wooden table. The lighting is bright and even, highlighting the Japanese text and numerical data for OCR processing. The aesthetic is clean and professional, using a soft blue tint to highlight areas like store names and totals where the AI is extracting data. This image represents a functional and modern financial management workflow." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCzWi3q2pL0v2GZXrKGTo6VFSsWNytKecL5sH02KHzgievQSGR1jkYMNlQFJnWDl59axke4druaTuQgJYojwqDzfBQr1Et3eX_O5QnzgQSdCiWzQxRs_DOA10dx0ETYI_Nd4B408HDd3yvbEROcjEWt92_T5wQTMIegvhdQ8Kwh1gB9cJX9v1Vuv_zB6frDULojVVekKngmo9ayh4aOLwx948WMhxccEA5PV-4JpJz2CR3IlNSCCS8TPjr2AZs71poVMoPY4F3Il3Q"/>
<!-- OCR Overlays (Simulated) -->
<div class="absolute top-[15%] left-[20%] w-[40%] h-[5%] bg-secondary-container/30 border border-secondary rounded-sm"></div>
<div class="absolute top-[25%] left-[60%] w-[25%] h-[4%] bg-secondary-container/30 border border-secondary rounded-sm"></div>
<div class="absolute bottom-[20%] right-[15%] w-[30%] h-[6%] bg-secondary-container/30 border border-secondary rounded-sm"></div>
</div>
</div>
</section>
<!-- Analysis Form Panel (Right/Bottom) -->
<section class="lg:col-span-7 xl:col-span-8 flex flex-col gap-stack-lg">
<!-- High-End Bento Section -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Confidence Card -->
<div class="md:col-span-2 bg-secondary-container/10 p-stack-md rounded-xl border border-secondary-container flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<div>
<p class="font-h3 text-h3 text-on-secondary-container">解析精度：高い (98%)</p>
<p class="font-body-sm text-body-sm text-on-secondary-container/80">AIは領収書の内容を正確に読み取りました。内容に間違いがないか確認してください。</p>
</div>
</div>
<!-- Main Input Fields -->
<div class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(26,54,93,0.05)] flex flex-col gap-stack-md">
<!-- Store Name -->
<div class="flex flex-col gap-unit relative">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant opacity-80">店名</label>
<span class="flex items-center gap-1 text-tertiary-fixed-dim bg-tertiary-container px-2 py-0.5 rounded-full text-[10px] font-bold">
<span class="material-symbols-outlined text-[12px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span> 確実
                </span>
</div>
<div class="relative group">
<input class="w-full bg-white border border-outline-variant rounded-lg p-3 font-data-entry text-data-entry focus:border-secondary focus:ring-1 focus:ring-secondary transition-all outline-none" type="text" value="セブン-イレブン 日本橋店"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 opacity-40 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="edit">edit</span>
</div>
</div>
</div>
<!-- Date -->
<div class="flex flex-col gap-unit">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant opacity-80">日付</label>
<span class="flex items-center gap-1 text-tertiary-fixed-dim bg-tertiary-container px-2 py-0.5 rounded-full text-[10px] font-bold">
<span class="material-symbols-outlined text-[12px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span> 確実
                </span>
</div>
<div class="relative group">
<input class="w-full bg-white border border-outline-variant rounded-lg p-3 font-data-entry text-data-entry focus:border-secondary focus:ring-1 focus:ring-secondary transition-all outline-none" type="date" value="2023-10-27"/>
</div>
</div>
</div>
<!-- Financial Details Card -->
<div class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(26,54,93,0.05)] flex flex-col gap-stack-md">
<!-- Amount -->
<div class="flex flex-col gap-unit">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant opacity-80">金額</label>
<span class="flex items-center gap-1 text-tertiary-fixed-dim bg-tertiary-container px-2 py-0.5 rounded-full text-[10px] font-bold">
<span class="material-symbols-outlined text-[12px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span> 確実
                </span>
</div>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-h2 text-h2 text-on-surface-variant">¥</span>
<input class="w-full bg-white border border-outline-variant rounded-lg p-3 pl-10 font-h2 text-h2 text-secondary focus:border-secondary focus:ring-1 focus:ring-secondary transition-all outline-none" type="text" value="1,280"/>
</div>
</div>
<!-- Account Category (Suggestions) -->
<div class="flex flex-col gap-unit">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant opacity-80">勘定科目 (AI提案)</label>
<span class="flex items-center gap-1 text-[#b45309] bg-[#fef3c7] px-2 py-0.5 rounded-full text-[10px] font-bold">
<span class="material-symbols-outlined text-[12px]" data-icon="info">info</span> 確認推奨
                </span>
</div>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 bg-secondary text-on-secondary rounded-full font-body-sm transition-all shadow-sm">消耗品費</button>
<button class="px-4 py-2 border border-outline-variant text-on-surface-variant rounded-full font-body-sm hover:bg-surface-container transition-all">旅費交通費</button>
<button class="px-4 py-2 border border-outline-variant text-on-surface-variant rounded-full font-body-sm hover:bg-surface-container transition-all">交際費</button>
<button class="px-4 py-2 border border-outline-variant text-on-surface-variant rounded-full font-body-sm hover:bg-surface-container transition-all flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="add">add</span> その他
                </button>
</div>
</div>
</div>
<!-- Transaction Notes/Category Detail -->
<div class="md:col-span-2 bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(26,54,93,0.05)]">
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant opacity-80">備考 / メモ</label>
<textarea class="w-full bg-white border border-outline-variant rounded-lg p-3 font-body-md text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary transition-all outline-none resize-none" placeholder="内容の詳細などを入力..." rows="2"></textarea>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-stack-md mt-4">
<button class="flex-1 bg-secondary text-on-secondary py-4 rounded-lg font-h3 text-h3 shadow-lg hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="save" style="font-variation-settings: 'FILL' 1;">save</span>
            保存する
          </button>
<button class="flex-1 bg-white border border-secondary text-secondary py-4 rounded-lg font-h3 text-h3 hover:bg-surface-container transition-all active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="history_edu">history_edu</span>
            修正する
          </button>
</div>
</section>
</div>
</main>
<!-- BottomNavBar (Mobile Only Logic via CSS visibility) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-4 pb-safe bg-surface-container-lowest dark:bg-on-background shadow-[0px_-4px_12px_rgba(26,54,93,0.05)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors scale-95 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="add_a_photo">add_a_photo</span>
<span class="font-label-caps text-label-caps">Upload</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors scale-95 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label-caps text-label-caps">History</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors scale-95 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-caps text-label-caps">Settings</span>
</a>
</nav>
</body></html>
