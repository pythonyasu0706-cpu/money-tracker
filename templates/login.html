<!-- /template/login.html -->
<!DOCTYPE html>

<html class="light" lang="ja"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;family=Inter:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error": "#ffffff",
                    "secondary-container": "#66affe",
                    "on-tertiary": "#ffffff",
                    "background": "#f7fafc",
                    "on-tertiary-fixed-variant": "#00522f",
                    "tertiary": "#002713",
                    "tertiary-container": "#003f23",
                    "inverse-surface": "#2d3133",
                    "inverse-on-surface": "#eef1f3",
                    "on-primary": "#ffffff",
                    "on-tertiary-fixed": "#002110",
                    "on-surface-variant": "#43474e",
                    "outline-variant": "#c4c6cf",
                    "surface-variant": "#e0e3e5",
                    "error": "#ba1a1a",
                    "surface-container-high": "#e5e9eb",
                    "on-primary-fixed-variant": "#2d476f",
                    "tertiary-fixed-dim": "#74db9d",
                    "surface-container-low": "#f1f4f6",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#181c1e",
                    "surface-tint": "#455f88",
                    "error-container": "#ffdad6",
                    "surface": "#f7fafc",
                    "on-secondary-fixed-variant": "#00497e",
                    "on-primary-container": "#86a0cd",
                    "on-surface": "#181c1e",
                    "outline": "#74777f",
                    "on-primary-fixed": "#001b3c",
                    "secondary": "#0061a5",
                    "secondary-fixed": "#d2e4ff",
                    "surface-container": "#ebeef0",
                    "surface-bright": "#f7fafc",
                    "on-error-container": "#93000a",
                    "primary-fixed-dim": "#adc7f7",
                    "primary": "#002045",
                    "primary-container": "#1a365d",
                    "primary-fixed": "#d6e3ff",
                    "on-secondary-fixed": "#001d37",
                    "on-secondary-container": "#004172",
                    "surface-container-highest": "#e0e3e5",
                    "secondary-fixed-dim": "#9fcaff",
                    "tertiary-fixed": "#91f8b8",
                    "surface-dim": "#d7dadc",
                    "on-secondary": "#ffffff",
                    "on-tertiary-container": "#4bb278",
                    "inverse-primary": "#adc7f7"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "unit": "8px",
                    "container-max": "1200px",
                    "gutter": "24px",
                    "stack-sm": "8px",
                    "stack-lg": "32px",
                    "stack-md": "16px",
                    "margin-desktop": "40px"
            },
            "fontFamily": {
                    "h3": ["Noto Sans JP"],
                    "body-md": ["Noto Sans JP"],
                    "h2": ["Noto Sans JP"],
                    "body-sm": ["Noto Sans JP"],
                    "label-caps": ["Inter"],
                    "data-entry": ["Inter"],
                    "body-lg": ["Noto Sans JP"],
                    "h1": ["Noto Sans JP"]
            },
            "fontSize": {
                    "h3": ["20px", {"lineHeight": "1.5", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "h2": ["24px", {"lineHeight": "1.4", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "data-entry": ["16px", {"lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "h1": ["30px", {"lineHeight": "1.4", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .receipt-highlight {
            background: linear-gradient(135deg, rgba(102, 175, 254, 0.1) 0%, rgba(26, 54, 93, 0.05) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface">

<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 bg-surface dark:bg-on-background border-b border-surface-variant dark:border-outline-variant">
<div class="flex items-center gap-4">
<h1 class="font-h2 text-h2 text-primary dark:text-primary-fixed">OCR Expense</h1>
</div>
</header>

<main class="pt-24 pb-32 px-margin-mobile max-w-container-max mx-auto">
  <div class="h-full flex flex-col items-center justify-center">

    <!-- カード -->
    <div class="w-full max-w-md bg-surface-container-lowest rounded-xl
                shadow-[0px_8px_24px_rgba(26,54,93,0.08)]
                border border-outline-variant p-8">

      <!-- ヘッダ -->
      <div class="text-center mb-6">
        <h2 class="font-h1 text-h1 text-primary">ログイン</h2>
        <p class="text-body-sm text-on-surface-variant mt-1">
          OCR Expenseへようこそ
        </p>
      </div>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <p class="mt-3 text-sm text-red-500 bg-red-50 px-3 py-2 rounded">
            {{ messages[0] }}
          </p>
        {% endif %}
      {% endwith %}

      <!-- フォーム -->
      <form method="POST" class="flex flex-col gap-5">

        <!-- email -->
        <div class="flex flex-col gap-1">
          <label class="font-label-caps text-label-caps text-on-surface-variant">
            EMAIL
          </label>
          <input
            name="email"
            type="email"
            placeholder="example@email.com"
            class="w-full bg-white border border-outline-variant
                   rounded-lg px-4 py-3
                   text-body-md
                   focus:outline-none focus:border-secondary
                   focus:ring-2 focus:ring-secondary/20
                   transition"
          />
        </div>

        <!-- password -->
        <div class="flex flex-col gap-1">
          <label class="font-label-caps text-label-caps text-on-surface-variant">
            PASSWORD
          </label>
          <input
            name="password"
            type="password"
            placeholder="••••••••"
            class="w-full bg-white border border-outline-variant
                   rounded-lg px-4 py-3
                   text-body-md
                   focus:outline-none focus:border-secondary
                   focus:ring-2 focus:ring-secondary/20
                   transition"
          />
        </div>

        <!-- ボタン（ここが重要） -->
        <button
          type="submit"
          class="mt-2 w-full py-3 rounded-lg
                 bg-secondary text-white font-bold
                 shadow-[0px_6px_16px_rgba(0,97,165,0.25)]
                 hover:opacity-90 active:scale-[0.98]
                 transition"
        >
          ログイン
        </button>

      </form>
    </div>
  </div>
</main>
</body>
</html>
