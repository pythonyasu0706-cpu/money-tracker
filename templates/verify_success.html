<!-- /template/verify_success.html -->
{% extends "base.html" %}
{% block header_right %}
{% endblock %}
{% block main_class %}pt-24 pb-32 px-margin-mobile max-w-container-max mx-auto{% endblock %}
{% block content %}
  <div class="h-full flex items-center justify-center">

    <div class="w-full max-w-md bg-surface-container-lowest rounded-xl
                shadow-[0px_8px_24px_rgba(26,54,93,0.08)]
                border border-outline-variant p-8 text-center">

      <h2 class="font-h1 text-h1 text-primary mb-3">
        認証完了
      </h2>

      <p class="text-body-md text-on-surface-variant mb-6">
        メール認証が正常に完了しました。<br>
        ログインして利用を開始できます。
      </p>

      <a href="{{ url_for('login') }}"
         class="inline-block w-full py-3 rounded-lg
                bg-secondary text-white font-bold
                shadow-[0px_6px_16px_rgba(0,97,165,0.25)]
                hover:opacity-90 active:scale-[0.98]
                transition">
        ログインへ進む
      </a>

    </div>
  </div>
{% endblock %}
{% block bottom_nav %}
{% endblock %}
